<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Sistema de Gestión y Proyección Académica"
    />

    <title>SGPA | Acceso</title>
  </head>

  <body>

    <!-- ===================================================== -->
    <!-- LOGIN -->
    <!-- ===================================================== -->

    <main
      id="loginView"
      class="login-screen"
    >

      <section class="login-card">

        <!-- Barra roja lateral -->
        <div
          class="login-red-line"
          aria-hidden="true"
        ></div>


        <!-- ================================================= -->
        <!-- PANEL IZQUIERDO -->
        <!-- ================================================= -->

        <section class="login-left">

          <!-- Logo -->

          <div class="brand-area">

            <img
              src="/AVI_horizontal.png"
              alt="AVI Universidad Nacional"
              class="brand-logo"
              draggable="false"
            />

          </div>


          <!-- Bienvenida -->

          <div class="welcome-area">

            <h1>
              Bienvenido
            </h1>

            <p>
              Acceda con sus credenciales
              institucionales.
            </p>

          </div>


          <!-- Información institucional -->

          <div class="left-footer">

            <p>
              Campus Nicoya
            </p>

            <span>
              Universidad Nacional
            </span>

          </div>

        </section>


        <!-- ================================================= -->
        <!-- PANEL DERECHO -->
        <!-- ================================================= -->

        <section class="login-right">

          <div class="form-container">

            <!-- Encabezado -->

            <header class="form-header">

              <h2>
                Iniciar sesión
              </h2>

              <p>
                Ingrese sus datos para continuar.
              </p>

            </header>


            <!-- ============================================= -->
            <!-- FORMULARIO -->
            <!-- ============================================= -->

            <form
              id="loginForm"
              novalidate
            >


              <!-- =========================================== -->
              <!-- USUARIO -->
              <!-- =========================================== -->

              <div class="form-group">

                <label for="correo">
                  Usuario
                </label>


                <div class="input-container">

                  <i
                    data-lucide="user"
                    class="input-icon"
                    aria-hidden="true"
                  ></i>


                  <input
                    id="correo"
                    name="correo"
                    type="text"
                    autocomplete="username"
                    placeholder="Ingrese su usuario"
                    spellcheck="false"
                    required
                  />

                </div>

              </div>


              <!-- =========================================== -->
              <!-- CONTRASEÑA -->
              <!-- =========================================== -->

              <div class="form-group">

                <label for="password">
                  Contraseña
                </label>


                <div
                  class="input-container password-wrap"
                >

                  <i
                    data-lucide="lock-keyhole"
                    class="input-icon"
                    aria-hidden="true"
                  ></i>


                  <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="••••••••"
                    required
                  />


                  <!-- Mostrar / ocultar -->

                  <button
                    id="togglePassword"
                    type="button"
                    class="eye-button"
                    aria-label="Mostrar contraseña"
                    title="Mostrar contraseña"
                  >

                    <i
                      id="passwordEye"
                      data-lucide="eye"
                      aria-hidden="true"
                    ></i>

                  </button>

                </div>

              </div>


              <!-- =========================================== -->
              <!-- ERROR -->
              <!-- =========================================== -->

              <div
                id="loginError"
                class="login-error hidden"
                role="alert"
                aria-live="polite"
              ></div>


              <!-- =========================================== -->
              <!-- OPCIONES -->
              <!-- =========================================== -->

              <div class="form-extra">

                <label
                  class="remember-wrap"
                  for="rememberMe"
                >

                  <input
                    id="rememberMe"
                    type="checkbox"
                  />

                  <span>
                    Recordarme
                  </span>

                </label>


                <button
                  id="forgotPasswordButton"
                  type="button"
                  class="forgot-button"
                >
                  ¿Olvidó su contraseña?
                </button>

              </div>


              <!-- =========================================== -->
              <!-- BOTÓN LOGIN -->
              <!-- =========================================== -->

              <button
                id="loginButton"
                type="submit"
                class="login-button"
              >

                <span id="loginButtonText">
                  Acceder
                </span>

              </button>

            </form>

          </div>

        </section>

      </section>

    </main>


    <!-- ===================================================== -->
    <!-- JAVASCRIPT -->
    <!-- ===================================================== -->

    <script
      type="module"
      src="/src/renderer.js"
    ></script>

  </body>
</html>
